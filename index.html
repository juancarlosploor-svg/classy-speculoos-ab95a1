 límite por calendario`,climate:!1,cats:[`carro`],mechanism:`Saturación por agua y sedimento; el combustible parado genera borra y microorganismos.`,basis:`Fabricante`,source:`Cummins: filtro de combustible, 12 a 18 meses en B6.7 y C8.3, 6 meses en ISX12.`,ref:`c02`}),Hp({key:`d09`,system:`Refrigeración`,name:`Refrigerante: prueba de punto de congelación y química`,climate:!0,cats:[`carro`],mechanism:`Se agotan los inhibidores de corrosión y baja la concentración de glicol con el tiempo y por pérdidas.`,basis:`Fabricante`,source:`Cummins: prueba cada 6 meses (punto de congelación dos veces al año, química una vez al año); Equipment World: concentración con refractómetro cada 6 meses.`,ref:`c04`,note:`La tarea c04 pasa a 6 meses para cumplir este criterio.`}),Hp({key:`d10`,system:`Refrigeración`,name:`Refrigerante: cambio por calendario`,climate:!1,cats:[`carro`],mechanism:`Pérdida de inhibidores y acidificación del fluido.`,basis:`Fabricante`,source:`Cummins: vaciar y rellenar a los 5 años (ELC); refrigerantes convencionales, plazo menor según ficha del producto.`,ref:`c05`,note:`CEMBO parte en 24 meses por seguridad. Con refrigerante ELC y pruebas favorables se puede extender hasta el plazo del fabricante.`}),Hp({key:`d11`,system:`Transmisión`,name:`Aceite de transmisión automática Allison TES-295: cambio por calendario`,climate:!1,cats:[`carro`],mechanism:`Oxidación y pérdida de aditivos del aceite sintético.`,basis:`Fabricante`,source:`Allison Transmission, recomendación para flotas de recolección de residuos (Motor Equipment News, 2014): TES-295 a 240.000 km, 6.000 horas o 48 meses, lo que ocurra primero. Es un servicio severo distinto al de bomberos.`,ref:`c10`,note:`Solo con fluido TES-295 confirmado. Confirmar el intervalo para servicio de bomberos en el manual Allison del modelo. Con aceite mineral o sin dato, mantener el plazo de c10.`}),Hp({key:`d12`,system:`Frenos`,name:`Líquido de frenos (circuito hidráulico): prueba de humedad y cambio`,months:24,climat
